services:
  mcp:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/linkedin.sqlite
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - linkedin-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
volumes:
  linkedin-data:
